databaseChangeLog:
  - changeSet:
      id: match-state-and-audit
      author: calendar
      changes:
        - createTable:
            tableName: season_match_state
            columns:
              - column:
                  name: competition_season_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_season_match_state
                    references: competition_season(id)
                    foreignKeyName: fk_match_state_season
              - column:
                  name: round_no
                  type: INT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_season_match_state
              - column:
                  name: home
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_season_match_state
              - column:
                  name: away
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_season_match_state
              - column:
                  name: status
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: play_date
                  type: DATE
              - column:
                  name: play_hour
                  type: VARCHAR(5)
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE season_match_state ADD CONSTRAINT ck_season_match_state_status CHECK (status IN ('PENDIENTE','PLANIFICADA','ENTREGADA','JUGADA'))
        - createTable:
            tableName: match_change_audit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_match_change_audit
              - column:
                  name: competition_season_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: competition_season(id)
                    foreignKeyName: fk_match_audit_season
              - column:
                  name: round_no
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: home
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: away
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: actor
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: authorized_role
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: previous_status
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: new_status
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: previous_values
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: new_values
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: match_change_audit
            indexName: ix_match_change_audit_season
            columns:
              - column:
                  name: competition_season_id
              - column:
                  name: round_no
        - sql:
            sql: |
              INSERT INTO season_match_state
                (competition_season_id, round_no, home, away, status, play_date, play_hour, updated_at)
              SELECT f.competition_season_id, f.round_no, f.home, f.away,
                     CASE WHEN f.play_date IS NULL THEN 'PENDIENTE' ELSE 'PLANIFICADA' END,
                     f.play_date, f.play_hour, CURRENT_TIMESTAMP
                FROM fixture f
               WHERE NOT EXISTS (
                 SELECT 1 FROM season_match_state s
                  WHERE s.competition_season_id = f.competition_season_id
                    AND s.round_no = f.round_no AND s.home = f.home AND s.away = f.away
               )

name: calendar-morocco-p02-oidc-it

services:
  keycloak:
    image: quay.io/keycloak/keycloak:19.0.3
    restart: "no"
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${CALENDAR_OIDC_IT_ADMIN_USER:?Set local isolated test admin}
      KEYCLOAK_ADMIN_PASSWORD: ${CALENDAR_OIDC_IT_ADMIN_PASSWORD:?Set local isolated test admin password}
    ports:
      - "127.0.0.1:18080:8080"

name: calendar-morocco-p02-it-20261025

services:
  postgres:
    image: postgres:17.6-alpine
    restart: "no"
    environment:
      POSTGRES_DB: calendar_morocco_it
      POSTGRES_USER: calendar_it
      POSTGRES_PASSWORD: ${CALENDAR_PG_PASSWORD:?Set CALENDAR_PG_PASSWORD in the ignored local env file}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - isolated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_it -d calendar_morocco_it"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CALENDAR_MSSQL_SA_PASSWORD:?Set CALENDAR_MSSQL_SA_PASSWORD in the ignored local env file}
      MSSQL_MEMORY_LIMIT_MB: "4096"
    mem_limit: 5g
    shm_size: 1gb
    ports:
      - "127.0.0.1:11434:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - isolated
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  postgres-data:
    name: calendar-morocco-p02-it-20261025-postgres-data
  mssql-data:
    name: calendar-morocco-p02-it-20261025-mssql-data

networks:
  isolated:
    name: calendar-morocco-p02-it-20261025-net

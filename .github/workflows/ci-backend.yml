name: Backend CI

# PostgreSQL 16 como servicio -> tests del motor (sin BD) -> liquibase:validate + update
# -> ./mvnw clean verify (todos los tests, incluidos los de PostgreSQL real) -> imagen Docker en GHCR.

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag override"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/es-mev-applications/calendar/calendar-backend

jobs:
  build-and-test:
    name: Build and Test (Java 21 + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: calendar_test
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U calendar -d calendar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/calendar_test
      DB_USERNAME: calendar
      DB_PASSWORD: calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw

      - name: Engine tests (parity with legacy v0, no database)
        run: >-
          ./mvnw -B test
          -Dtest='EngineParityTest,PlanningParametersTest,SetupToEngineMapperTest,SetupValidatorTest,EngineTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Liquibase validate + update (schema and reference catalogs on PostgreSQL 16)
        run: ./mvnw -B liquibase:validate liquibase:update

      - name: Build and verify (all tests)
        run: ./mvnw -B clean verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image (GHCR)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
      - name: Login GHCR
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
